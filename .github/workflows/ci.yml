name: FlashStock CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # -----------------------------------------------------------------
  # 1. BUILD Y PRUEBAS PARA CADA MICROSERVICIO JAVA (EN PARALELO)
  # -----------------------------------------------------------------
  backend:
    name: Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            path: auth
            port: 8081
          - service: inventory
            path: inventory
            port: 8082
          - service: orden
            path: orden
            port: 8083
          - service: shipping
            path: shipping
            port: 8084

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    env:
      PORT: ${{ matrix.port }}
      SPRING_DATASOURCE_URL: jdbc:h2:mem:${{ matrix.service }};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
      ADMIN_EMAIL: aron83353@gmail.com
      ADMIN_EMAIL_2: al.zegers@gmail.com
      CASHFLOW_UNIT_VALUE: "12.5"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID}}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET}}
      MAIL_PROVIDER: gmail
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "465"
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME}}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Si tienes ./mvnw en cada carpeta usa ./mvnw, si no usa mvn
      - name: Run unit tests and generate coverage
        run: mvn clean test jacoco:report

      - name: Build JAR package
        run: mvn package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.path }}/target/*.jar

  # -----------------------------------------------------------------
  # 2. BUILD Y LINT DE FRONTEND (NEXT.JS + PNPM)
  # -----------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashstock-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: flashstock-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Build Next.js app
        run: pnpm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: flashstock-frontend/.next

  # -----------------------------------------------------------------
  # 3. ANÁLISIS DE SEGURIDAD CON SNYK
  # -----------------------------------------------------------------
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js & Snyk
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Security Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth $SNYK_TOKEN
          snyk test --all-projects --severity-threshold=high || echo "Snyk encontró vulnerabilidades, revisa el reporte."
          snyk test --all-projects --json > snyk-report.json || true

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  # -----------------------------------------------------------------
  # 4. ANÁLISIS DE CÓDIGO CON SONARCLOUD
  # -----------------------------------------------------------------

  sonar-cloud:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: backend

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ==========================================
      # VALIDAR TOKEN
      # ==========================================

      - name: Validate SonarCloud Token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN no está configurado"
            exit 1
          fi

      # ==========================================
      # SONARCLOUD - MICROSERVICIOS
      # ==========================================

      - name: Run SonarCloud on each Java module
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          set -euo pipefail

          SONAR_PLUGIN="org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar"

          for service in auth gateway inventory orden shipping; do

            echo "========================================"
            echo "Analizando microservicio: $service"
            echo "========================================"

            if [ ! -f "$service/pom.xml" ]; then
              echo "::error::No existe $service/pom.xml"
              exit 1
            fi

            mvn --batch-mode \
              -f "$service/pom.xml" \
              verify \
              "$SONAR_PLUGIN" \
              -Dsonar.projectKey="aronaon_flashstock-${service}" \
              -Dsonar.organization=aronoan \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true

            echo "Análisis terminado: $service"

          done
