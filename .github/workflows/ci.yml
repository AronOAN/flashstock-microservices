name: FlashStock CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # -----------------------------------------------------------------
  # 1. BUILD Y PRUEBAS PARA CADA MICROSERVICIO JAVA (EN PARALELO)
  # -----------------------------------------------------------------
  backend:
    name: Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            path: auth
            port: 8081
          - service: inventory
            path: inventory
            port: 8082
          - service: orden
            path: orden
            port: 8083
          - service: shipping
            path: shipping
            port: 8084

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    env:
      PORT: ${{ matrix.port }}
      SPRING_DATASOURCE_URL: jdbc:h2:mem:${{ matrix.service }};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
      ADMIN_EMAIL: aron83353@gmail.com
      ADMIN_EMAIL_2: al.zegers@gmail.com
      CASHFLOW_UNIT_VALUE: "12.5"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID}}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET}}
      MAIL_PROVIDER: gmail
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "465"
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME}}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Si tienes ./mvnw en cada carpeta usa ./mvnw, si no usa mvn
      - name: Run unit tests and generate coverage
        run: mvn clean test jacoco:report

      - name: Build JAR package
        run: mvn package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.path }}/target/*.jar

  # -----------------------------------------------------------------
  # 2. BUILD Y LINT DE FRONTEND (NEXT.JS + PNPM)
  # -----------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashstock-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: flashstock-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Linter
        run: pnpm run lint

      - name: Build Next.js app
        run: pnpm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: flashstock-frontend/.next

  # -----------------------------------------------------------------
  # 3. ANÁLISIS DE SEGURIDAD CON SNYK
  # -----------------------------------------------------------------
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17 for Maven scanning
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Snyk CLI
        uses: snyk/actions/setup@b075801f26076be9bb50521154cafab73f44da0c
        with:
          snyk-version: v1.1307.4

      - name: Run Snyk Security Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Maven wrappers in the services are not executable in the checkout.
        # Use the runner's Maven; keep fail-fast so an unscanned project fails CI.
        run: snyk test --all-projects --maven-skip-wrapper --fail-fast --severity-threshold=high --json-file-output=snyk-report.json

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json


 # -----------------------------------------------------------------
  # 4. ANÁLISIS DE CÓDIGO CON SONARCLOUD
  # -----------------------------------------------------------------

  sonar-cloud:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: backend

    permissions:
      contents: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ==========================================
      # VALIDAR TOKEN
      # ==========================================

      - name: Validate SonarCloud Token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN no está configurado"
            exit 1
          fi

      # ==========================================
      # COMPILAR TODOS LOS MICROSERVICIOS
      # ==========================================

      - name: Build modules and prepare SonarCloud
        shell: bash
        run: |
          set -euo pipefail

          services=(auth inventory orden shipping)

          sources=()
          tests=()
          binaries=()
          test_binaries=()
          coverage=()
          junit_reports=()
          java_libraries=()
          test_libraries=()

          join_csv() {
            local IFS=,
            printf '%s' "$*"
          }

          for service in "${services[@]}"; do

            echo "========================================"
            echo "Compilando: $service"
            echo "========================================"

            if [ ! -f "$service/pom.xml" ]; then
              echo "::error::No existe $service/pom.xml"
              exit 1
            fi

            mvn --batch-mode \
              -f "$service/pom.xml" \
              clean verify

            # Build the exact Maven dependency classpaths for Sonar Java analysis.
            # A scanner CLI does not infer these from pom.xml like SonarScanner for Maven.
            mvn --batch-mode -f "$service/pom.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.7.1:build-classpath \
              -DincludeScope=compile \
              -Dmdep.outputFile="$PWD/$service/target/sonar-main-classpath.txt"
            mvn --batch-mode -f "$service/pom.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.7.1:build-classpath \
              -DincludeScope=test \
              -Dmdep.outputFile="$PWD/$service/target/sonar-test-classpath.txt"

            for scope in main test; do
              classpath_file="$service/target/sonar-${scope}-classpath.txt"
              if [ ! -s "$classpath_file" ]; then
                echo "::error::Maven did not produce $classpath_file"
                exit 1
              fi
              IFS=: read -r -a jars <<< "$(cat "$classpath_file")"
              for jar in "${jars[@]}"; do
                if [ -f "$jar" ]; then
                  if [ "$scope" = main ]; then
                    java_libraries+=("$jar")
                  else
                    test_libraries+=("$jar")
                  fi
                else
                  echo "::error::Missing dependency from $classpath_file: $jar"
                  exit 1
                fi
              done
            done

            # Código fuente
            if [ -d "$service/src/main" ]; then
              sources+=("$service/src/main")
            fi

            # Bytecode requerido para analizar Java
            if [ -d "$service/target/classes" ]; then
              binaries+=("$service/target/classes")
            elif [ -d "$service/src/main/java" ]; then
              echo "::error::No hay clases compiladas para $service"
              exit 1
            fi

            # Código de pruebas
            if [ -d "$service/src/test" ]; then
              tests+=("$service/src/test")
            fi

            # Clases de pruebas compiladas
            if [ -d "$service/target/test-classes" ]; then
              test_binaries+=("$service/target/test-classes")
            fi

            # Cobertura JaCoCo
            REPORT="$service/target/site/jacoco/jacoco.xml"

            if [ -s "$REPORT" ]; then
              coverage+=("$REPORT")
              echo "JaCoCo encontrado: $REPORT"
            else
              echo "::error::Sin reporte JaCoCo para $service"
              exit 1
            fi

            # Resultados JUnit
            if [ -d "$service/target/surefire-reports" ]; then
              junit_reports+=("$service/target/surefire-reports")
            fi

          done

          # ==========================================
          # CONFIGURACIÓN ÚNICA DE SONARCLOUD
          # ==========================================

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::No se encontraron fuentes para analizar"
            exit 1
          fi

          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "::error::No se encontraron clases Java compiladas"
            exit 1
          fi

          {
            echo "sonar.projectKey=aronoan_flashstock-microservices"
            echo "sonar.organization=aronoan"
            echo "sonar.host.url=https://sonarcloud.io"
            echo "sonar.sourceEncoding=UTF-8"

            echo "sonar.sources=$(join_csv "${sources[@]}")"
            echo "sonar.java.binaries=$(join_csv "${binaries[@]}")"

            if [ "${#java_libraries[@]}" -eq 0 ] || [ "${#test_libraries[@]}" -eq 0 ]; then
              echo "::error::Missing Java library classpath for Sonar"
              exit 1
            fi
            # Sonar expects comma-separated jar paths, not Maven's colon-separated classpath.
            echo "sonar.java.libraries=$(printf '%s\n' "${java_libraries[@]}" | sort -u | paste -sd, -)"
            echo "sonar.java.test.libraries=$(printf '%s\n' "${test_libraries[@]}" | sort -u | paste -sd, -)"
            echo "sonar.java.jdkHome=${JAVA_HOME}"

            # CPD-only exceptions: four deployable services intentionally carry identical
            # Cognito adapters. Still analyze them for rules AND JaCoCo coverage.
            # Use shared module refactoring later only when build/Docker topology supports it.
            echo "sonar.cpd.exclusions=**/common/AuthEmailResolver.java,**/config/CognitoAuthoritiesConverter.java,**/config/AwsCognitoSecurityConfig.java"

            if [ "${#tests[@]}" -gt 0 ]; then
              echo "sonar.tests=$(join_csv "${tests[@]}")"
            fi

            if [ "${#test_binaries[@]}" -gt 0 ]; then
              echo "sonar.java.test.binaries=$(join_csv "${test_binaries[@]}")"
            fi

            if [ "${#coverage[@]}" -gt 0 ]; then
              echo "sonar.coverage.jacoco.xmlReportPaths=$(join_csv "${coverage[@]}")"
            fi

            if [ "${#junit_reports[@]}" -gt 0 ]; then
              echo "sonar.junit.reportPaths=$(join_csv "${junit_reports[@]}")"
            fi

            echo "sonar.qualitygate.wait=true"

          } > sonar-project.properties

          echo "Configuración SonarCloud preparada; dependencias Java y pruebas incluidas."
          grep -E '^sonar\.(projectKey|sources|tests|coverage\.jacoco\.xmlReportPaths|qualitygate\.wait)=' sonar-project.properties

      # ==========================================
      # UN SOLO ANÁLISIS PARA TODO FLASHSTOCK
      # ==========================================

      - name: Analyze FlashStock with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
