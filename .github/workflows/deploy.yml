name: FlashStock Deploy (Vercel)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Selecciona el tipo de despliegue"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  frontend-vercel:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:

      # ==========================================
      # 1. OBTENER CÓDIGO
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. PROTEGER PRODUCCIÓN
      # ==========================================

      - name: Validate production branch
        if: ${{ inputs.target == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deployments are only allowed from main"
          exit 1

      # ==========================================
      # 3. VERIFICAR CREDENCIALES VERCEL
      # ==========================================

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      # ==========================================
      # 4. CONFIGURAR NODE Y PNPM
      # ==========================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: flashstock-frontend/pnpm-lock.yaml

      # ==========================================
      # 5. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Install dependencies
        run: |
          pnpm --dir flashstock-frontend install --frozen-lockfile

      # ==========================================
      # 6. VALIDAR FRONTEND
      # ==========================================

      - name: ESLint
        run: |
          pnpm --dir flashstock-frontend run lint

      - name: Authentication security tests
        run: |
          pnpm --dir flashstock-frontend run test:security

      # ==========================================
      # 7. INSTALAR VERCEL CLI
      # ==========================================

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ==========================================
      # 8. DESPLEGAR PREVIEW
      # ==========================================

      - name: Deploy Preview
        if: ${{ inputs.target == 'preview' }}
        run: |
          vercel deploy \
            --yes \
            --token "$VERCEL_TOKEN"

      # ==========================================
      # 9. DESPLEGAR PRODUCCIÓN
      # ==========================================

      - name: Deploy Production
        if: ${{ inputs.target == 'production' }}
        run: |
          vercel deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"