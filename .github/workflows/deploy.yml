name: FlashStock Deploy (AWS + Vercel)

# MANUAL ONLY until the four Java backends are hosted and API Gateway has working routes.
# This repository currently DOES NOT contain a runnable AWS ECS deployment.
on:
  workflow_dispatch:
    inputs:
      backend_ready:
        description: 'I have deployed all required Java services and verified API Gateway /api/inventory responds HTTP 200'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frontend-vercel:
    name: Verify API and deploy existing Vercel project
    if: ${{ inputs.backend_ready == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashstock-frontend
    env:
      AWS_API_BASE_URL: https://ly23z3a5hb.execute-api.us-east-1.amazonaws.com
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::$name missing"; exit 1; fi
          done
          # Public inventory must be routed to a functioning backend. A 404/502 stops deployment.
          curl --fail --silent --show-error --location \
            --max-time 20 "${AWS_API_BASE_URL}/api/inventory" -o /dev/null
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: flashstock-frontend/pnpm-lock.yaml
      - name: Install and validate
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
      - name: Deploy via Vercel CLI
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          # BFF secrets and backend URL MUST be in Vercel Project Settings -> Environment Variables.
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
