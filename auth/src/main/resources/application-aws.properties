# Production AWS profile: fail startup if database and Cognito settings are absent.
flashstock.cognito.issuer=${COGNITO_ISSUER_URL}
flashstock.cognito.client-id=${COGNITO_APP_CLIENT_ID}
app.security.legacy-admin-email-enabled=false
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=WARN
spring.security.oauth2.client.registration.google.client-id=disabled-google-client-id
spring.security.oauth2.client.registration.google.client-secret=disabled-google-client-secret

# Optional FlashStock-issued tokens, separate from Cognito/PKCE. Off until keys/table are provisioned.
flashstock.tokens.enabled=${FLASHSTOCK_TOKENS_ENABLED:false}
flashstock.tokens.issuer=flashstock-auth
flashstock.tokens.audience=flashstock-api
flashstock.tokens.refresh-audience=flashstock-auth-refresh
flashstock.tokens.key-id=${FLASHSTOCK_JWT_KEY_ID:flashstock-rs256-v1}
flashstock.tokens.private-key-der-base64=${FLASHSTOCK_JWT_PRIVATE_KEY_DER_BASE64:}
flashstock.tokens.public-key-der-base64=${FLASHSTOCK_JWT_PUBLIC_KEY_DER_BASE64:}
flashstock.tokens.access-seconds=${FLASHSTOCK_ACCESS_SECONDS:900}
flashstock.tokens.refresh-seconds=${FLASHSTOCK_REFRESH_SECONDS:604800}

# Backend-only browser token control; shared secret stored in Secrets Manager and Vercel server env.
flashstock.browser.site-origin=${FLASHSTOCK_SITE_URL:}
flashstock.browser.bff-secret-base64=${FLASHSTOCK_BFF_SHARED_SECRET:}
# FLASHSTOCK HYBRID AUTH
# Access JWT en memoria + refresh en servidor
# ==================================================

flashstock.hybrid.enabled=${FLASHSTOCK_HYBRID_ENABLED:false}

# Cognito actualmente tiene refresh válido por 1 día.
flashstock.hybrid.refresh.max-age-seconds=${FLASHSTOCK_REFRESH_MAX_AGE:86400}

# Origen autorizado del frontend.
flashstock.hybrid.site-origin=${FLASHSTOCK_SITE_URL}