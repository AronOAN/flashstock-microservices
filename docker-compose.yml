
services:

  # ==========================================================
  # API GATEWAY - NGINX
  # ==========================================================

  api-gateway:
    image: nginx:1.27-alpine
    container_name: flashstock-gateway
    restart: unless-stopped

    depends_on:
      auth:
        condition: service_started
      inve-service:
        condition: service_started
      orden-service:
        condition: service_started
      compras-service:
        condition: service_started

    ports:
      - "8080:8080"

    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_net


  # ==========================================================
  # DATABASE - AUTH
  # ==========================================================

  auth-db:
    image: postgres:16
    container_name: flashstock-auth-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: flashstock
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:-flashstock}"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

    networks:
      - auth_db_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U flashstock -d auth_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # DATABASE - INVENTORY
  # ==========================================================

  inve-db:
    image: postgres:16
    container_name: flashstock-inve-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: inve_db
      POSTGRES_USER: flashstock
      POSTGRES_PASSWORD: "${INVE_DB_PASSWORD:-flashstock}"

    volumes:
      - inve_postgres_data:/var/lib/postgresql/data

    networks:
      - inventory_db_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U flashstock -d inve_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # DATABASE - ORDEN
  # ==========================================================

  orden-db:
    image: postgres:16
    container_name: flashstock-orden-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: orden_db
      POSTGRES_USER: flashstock
      POSTGRES_PASSWORD: "${ORDEN_DB_PASSWORD:-flashstock}"

    volumes:
      - orden_postgres_data:/var/lib/postgresql/data

    networks:
      - orden_db_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U flashstock -d orden_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # DATABASE - COMPRAS
  # ==========================================================

  compras-db:
    image: postgres:16
    container_name: flashstock-compras-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: compras_db
      POSTGRES_USER: flashstock
      POSTGRES_PASSWORD: "${COMPRAS_DB_PASSWORD:-flashstock}"

    volumes:
      - compras_postgres_data:/var/lib/postgresql/data

    networks:
      - compras_db_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U flashstock -d compras_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # MICROSERVICE - AUTH
  # ==========================================================

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile

    container_name: flashstock-auth
    restart: unless-stopped

    depends_on:
      auth-db:
        condition: service_healthy

    environment:
      PORT: "8081"
      SERVER_PORT: "8081"

      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: flashstock
      SPRING_DATASOURCE_PASSWORD: "${AUTH_DB_PASSWORD:-flashstock}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      ADMIN_EMAIL: aron83353@gmail.com
      ADMIN_EMAIL_2: al.zegers@gmail.com

      CASHFLOW_UNIT_VALUE: "12.5"

      GOOGLE_CLIENT_ID: disabled-google-client-id
      GOOGLE_CLIENT_SECRET: disabled-google-client-secret

    expose:
      - "8081"

    networks:
      - app_net
      - auth_db_net


  # ==========================================================
  # MICROSERVICE - INVENTORY
  # ==========================================================

  inve-service:
    build:
      context: ./inventory
      dockerfile: Dockerfile

    container_name: flashstock-inve
    restart: unless-stopped

    depends_on:
      inve-db:
        condition: service_healthy

    environment:
      PORT: "8082"
      SERVER_PORT: "8082"

      SPRING_DATASOURCE_URL: jdbc:postgresql://inve-db:5432/inve_db
      SPRING_DATASOURCE_USERNAME: flashstock
      SPRING_DATASOURCE_PASSWORD: "${INVE_DB_PASSWORD:-flashstock}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      ADMIN_EMAIL: aro.acevedo@duocuc.cl
      ADMIN_EMAIL_2: al.zegers@duocuc.cl

      CASHFLOW_UNIT_VALUE: "12.5"

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      COGNITO_ISSUER_URL: ${COGNITO_ISSUER_URL}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}



    expose:
      - "8082"

    networks:
      - app_net
      - inventory_db_net


  # ==========================================================
  # MICROSERVICE - ORDEN
  # ==========================================================

  orden-service:
    build:
      context: ./orden
      dockerfile: Dockerfile

    container_name: flashstock-orden
    restart: unless-stopped

    depends_on:
      orden-db:
        condition: service_healthy

    environment:
      PORT: "8083"
      SERVER_PORT: "8083"

      SPRING_DATASOURCE_URL: jdbc:postgresql://orden-db:5432/orden_db
      SPRING_DATASOURCE_USERNAME: flashstock
      SPRING_DATASOURCE_PASSWORD: "${ORDEN_DB_PASSWORD:-flashstock}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      ADMIN_EMAIL: aro.acevedo@duocuc.cl
      ADMIN_EMAIL_2: al.zegers@duocuc.cl

      CASHFLOW_UNIT_VALUE: "12.5"

      GOOGLE_CLIENT_ID: disabled-google-client-id
      GOOGLE_CLIENT_SECRET: disabled-google-client-secret

    expose:
      - "8083"

    networks:
      - app_net
      - orden_db_net


  # ==========================================================
  # MICROSERVICE - COMPRAS / SHIPPING
  # ==========================================================

  compras-service:
    build:
      context: ./shipping
      dockerfile: Dockerfile

    container_name: flashstock-compras
    restart: unless-stopped

    depends_on:
      compras-db:
        condition: service_healthy

    environment:
      PORT: "8084"
      SERVER_PORT: "8084"

      SPRING_DATASOURCE_URL: jdbc:postgresql://compras-db:5432/compras_db
      SPRING_DATASOURCE_USERNAME: flashstock
      SPRING_DATASOURCE_PASSWORD: "${COMPRAS_DB_PASSWORD:-flashstock}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      ADMIN_EMAIL: aro.acevedo@duocuc.cl
      ADMIN_EMAIL_2: al.zegers@duocuc.cl

      CASHFLOW_UNIT_VALUE: "12.5"

      GOOGLE_CLIENT_ID: disabled-google-client-id
      GOOGLE_CLIENT_SECRET: disabled-google-client-secret

      MAIL_PROVIDER: gmail
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "465"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

    expose:
      - "8084"

    networks:
      - app_net
      - compras_db_net


# ==========================================================
# NETWORKS
# ==========================================================

networks:
  app_net:
    driver: bridge

  auth_db_net:
    driver: bridge
    internal: true

  inventory_db_net:
    driver: bridge
    internal: true

  orden_db_net:
    driver: bridge
    internal: true

  compras_db_net:
    driver: bridge
    internal: true

# ==========================================================
# VOLUMES
# ==========================================================

volumes:
  auth_postgres_data:
  inve_postgres_data:
  orden_postgres_data:
  compras_postgres_data:
