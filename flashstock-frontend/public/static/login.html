<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashStock | Acceso seguro</title><link rel="stylesheet" href="/static/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/css/style.css"></head>
<body><main class="container py-5" style="max-width:600px"><div class="bg-white rounded p-5 shadow">
<h1 class="text-primary">Iniciar sesión</h1>
<p>Accede a FlashStock mediante Amazon Cognito. Los permisos son asignados por los grupos USER y ADMIN.</p>
<p id="error" role="alert" class="text-danger" hidden>No se pudo iniciar sesión. Revisa la configuración de Cognito.</p>
<a class="btn btn-primary w-100 py-3 rounded-pill mb-3" target="_top" href="/auth/login">Iniciar sesión con Cognito</a>
<a class="btn btn-outline-secondary w-100 py-2 rounded-pill mb-3" target="_top" href="/">Volver al inicio</a>
<a class="btn btn-outline-danger w-100 py-2 rounded-pill" target="_top" href="/auth/logout">Cerrar sesión</a>
</div></main><script>if(new URLSearchParams(location.search).has('error'))document.getElementById('error').hidden=false;</script></body></html>
