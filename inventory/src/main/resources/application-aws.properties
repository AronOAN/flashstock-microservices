# Production AWS profile: fail startup if database and Cognito settings are absent.
flashstock.cognito.issuer=${COGNITO_ISSUER_URL}
flashstock.cognito.client-id=${COGNITO_APP_CLIENT_ID}
app.security.legacy-admin-email-enabled=false
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=WARN
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
flashstock.cognito.issuer=${COGNITO_ISSUER_URL}
flashstock.cognito.client-id=${COGNITO_APP_CLIENT_ID}